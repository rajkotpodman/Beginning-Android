name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.target_os }}/${{ matrix.target_arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target_os: windows
            target_arch: amd64
            output_name: beginning-android-windows-amd64.exe
          - target_os: linux
            target_arch: amd64
            output_name: beginning-android-linux-amd64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binary
        working-directory: desktop
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.target_os }}
          GOARCH: ${{ matrix.target_arch }}
        run: |
          mkdir -p ../dist
          go build -ldflags="-s -w" -o ../dist/${{ matrix.output_name }} ./cmd/beginning-android
          ls -lh ../dist/

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/${{ matrix.output_name }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permissions
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/beginning-android-release.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/beginning-android-release.apk

  release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect Release Binaries
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec cp {} dist/ \;
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/beginning-android-windows-amd64.exe
            dist/beginning-android-linux-amd64
            dist/beginning-android-release.apk
          name: "Beginning Android ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
